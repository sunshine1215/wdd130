<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Sarah Itse</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="wwr/">Rafting Website</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <div class="hero">
            <div class="content">
                <h1>WDD 130 | Sarah Itse</h1>
                <article>
                    <img src="images/rafting1.jpg" alt="Rafting Adventure">
                    <p>Experience thrilling river adventures with us!</p>
                </article>
            </div>
            <img src="images/hero.jpg" alt="Rafting River">
        </div>

        <!-- Profile Image -->
        <img src="images/profile.jpg" alt="Sarah Itse Profile picture" width="200">

        <!-- History Section -->
        <section class="history">
            <div class="history-left">
                <h2>History</h2>
                <p>Our rafting company has been guiding adventurers on rivers since 1995. Safety and
                    fun are our top priorities.</p>
            </div>
            <div class="history-right history-image">
                <img src="images/history.jpg" alt="Rafting History">
            </div>
        </section>

        <!-- Adventure Section -->
        <section class="adventure">
            <h2>Adventure Awaits You!</h2>
            <div class="adventure-gallery">
                <figure>
                    <img src="images/rafting1.jpg" alt="Los Dientes del Diablo">
                    <figcaption>Los Dientes del Diablo</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting2.jpg" alt="Big Mallard">
                    <figcaption>Big Mallard</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting3.jpg" alt="Half Day Adventure">
                    <figcaption>Half Day Adventure</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting4.jpg" alt="Rapid Rush">
                    <figcaption>Rapid Rush</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting5.jpg" alt="Extreme Rapids">
                    <figcaption>Extreme Rapids</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Rafting Company | Sarah Itse</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.jpg" alt="Facebook social media icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn social media icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.jpg" alt="Instagram social media icon">
            </a>
        </nav>
    </footer>

</body>

</html>
